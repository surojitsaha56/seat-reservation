spring.application.name=seat-reservation
server.port=${PORT:8080}

# Database. Set DATABASE_URL to a JDBC url (jdbc:postgresql://host:5432/db) or use DB_URL.
# DB_USER / DB_PASSWORD supply credentials. Render-style postgres:// URLs are not JDBC:
# convert to jdbc:postgresql://host:port/db and set DB_USER/DB_PASSWORD separately.
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/seats}}
spring.datasource.username=${DB_USER:seats}
spring.datasource.password=${DB_PASSWORD:seats}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# Tomcat tuned for bursts: queue connections rather than refuse them
server.tomcat.threads.max=200
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
# "db" is our DbHealthIndicator (dedicated connection, 2s timeouts): readiness fails closed within seconds
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Admin token for POST /shows (X-Admin-Token header). Override with ADMIN_TOKEN.
admin.token=${ADMIN_TOKEN:dev-admin-token}

# JWT (HS256). JWT_SECRET must be >= 32 bytes.
jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
jwt.expiry-seconds=${JWT_EXPIRY_SECONDS:3600}
# Dev/test token issuer (POST /auth/token); returns 404 when disabled.
auth.token-endpoint.enabled=${AUTH_TOKEN_ENDPOINT_ENABLED:true}

# Structured JSON logs to stdout (Spring Boot built-in, includes MDC). Use profile dev for plain text.
logging.structured.format.console=
