spring.application.name=seat-reservation
server.port=${PORT:8080}

# Database. Set DATABASE_URL to a JDBC url (jdbc:postgresql://host:5432/db) or use DB_URL.
# DB_USER / DB_PASSWORD supply credentials. Render-style postgres:// URLs are not JDBC:
# convert to jdbc:postgresql://host:port/db and set DB_USER/DB_PASSWORD separately.
spring.datasource.url=${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/seats}}
spring.datasource.username=${DB_USER:seats}
spring.datasource.password=${DB_PASSWORD:seats}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never

# Admin token for POST /shows (X-Admin-Token header). Override with ADMIN_TOKEN.
admin.token=${ADMIN_TOKEN:dev-admin-token}
